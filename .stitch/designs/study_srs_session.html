<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudPal - Study Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "on-secondary-fixed-variant": "#414755",

                      "on-tertiary-fixed": "#380d00",
                      "primary-container": "#112b8a",
                      "on-background": "#1b1b1f",
                      "secondary": "#585e6d",
                      "primary-fixed-dim": "#b9c3ff",
                      "surface-container": "#f0edf3",
                      "on-secondary-container": "#5e6473",
                      "surface-container-highest": "#e4e1e7",
                      "on-primary": "#ffffff",
                      "on-secondary-fixed": "#151c28",
                      "tertiary-container": "#641f00",
                      "surface-tint": "#4257b4",
                      "on-primary-fixed": "#001257",
                      "on-tertiary-container": "#ff763e",
                      "on-primary-container": "#8499fb",
                      "primary": "#001663",
                      "inverse-on-surface": "#f3eff6",
                      "tertiary-fixed": "#ffdbce",
                      "inverse-surface": "#303034",
                      "on-tertiary": "#ffffff",
                      "secondary-container": "#dde2f4",
                      "outline": "#757683",
                      "background": "#fcf8fe",
                      "surface-bright": "#fcf8fe",
                      "error": "#ba1a1a",
                      "on-surface": "#1b1b1f",
                      "tertiary-fixed-dim": "#ffb59a",
                      "on-tertiary-fixed-variant": "#802a00",
                      "on-error-container": "#93000a",
                      "error-container": "#ffdad6",
                      "tertiary": "#401100",
                      "surface": "#fcf8fe",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed-variant": "#283e9b",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#dde2f4",
                      "surface-container-low": "#f6f2f8",
                      "surface-dim": "#dcd9df",
                      "inverse-primary": "#b9c3ff"

              "borderRadius": {

                      "lg": "24px",
                      "xs": "4px",
                      "sm": "8px",
                      "xl": "32px",
                      "3xl": "64px",
                      "2xl": "48px",
                      "gutter": "16px",
                      "margin-desktop": "32px",
                      "md": "16px"
              },
              "fontFamily": {
                      "title-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-lg": ["Inter"],

                      "body-md": ["Inter"]

              "fontSize": {

                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],

                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],

                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
      </script>
<style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .micro-shadow {
            box-shadow: 0px 4px 12px rgba(11, 11, 15, 0.05);
        }
        
        /* Action Orange for Progress */
        .progress-bar-fill {
            background-color: #FF5B00; 
        }
        
        /* SM-2 Button Colors */
        .btn-again { background-color: #ffebee; color: #c62828; }
        .btn-hard { background-color: #fff3e0; color: #ef6c00; }
        .btn-good { background-color: #e8f5e9; color: #2e7d32; }
        .btn-easy { background-color: #f3e5f5; color: #6a1b9a; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Top App Bar with Progress -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim flex flex-col max-w-xl mx-auto shadow-sm">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Calculus II</h1>
<div class="flex items-center gap-sm">
<div class="flex items-center gap-xs px-3 py-1.5 bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="timer">timer</span>
<span class="font-label-md text-label-md text-on-surface-variant" id="pomodoro-timer">25:00</span>
</div>
</div>
</div>
<!-- Progress Header integrated into app bar -->
<div class="w-full px-margin-mobile pb-sm pt-xs flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<span class="font-label-md text-label-md text-secondary">Derivatives</span>
<span class="font-label-md text-label-md text-primary font-semibold">4 of 15</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full progress-bar-fill rounded-full transition-all duration-300" style="width: 26%;"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-28 pb-32 px-margin-mobile max-w-xl mx-auto w-full flex flex-col">
<!-- 3D Flashcard Container -->
<div class="flex-1 w-full flex items-center justify-center py-md perspective-1000">
<div class="w-full h-[400px] cursor-pointer" id="flashcard" onclick="flipCard()">
<div class="card-inner relative w-full h-full" id="card-inner">
<!-- Front -->
<div class="card-front absolute inset-0 w-full h-full bg-surface-container-lowest rounded-xl border border-surface-variant micro-shadow flex flex-col items-center justify-center p-lg">
<div class="flex-1 flex items-center justify-center w-full">
<p class="font-headline-lg-mobile text-headline-lg-mobile text-center text-on-surface">
                                Find the derivative of<br/>
<span class="text-primary mt-sm inline-block">f(x) = sin(x) * e^x</span>
</p>
</div>
<div class="mt-auto pt-md flex flex-col items-center gap-xs opacity-60">
<span class="material-symbols-outlined" data-icon="touch_app">touch_app</span>
<span class="font-label-sm text-label-sm">Tap to Flip</span>
</div>
</div>
<!-- Back -->
<div class="card-back absolute inset-0 w-full h-full bg-surface-container-lowest rounded-xl border border-surface-variant micro-shadow flex flex-col p-lg">
<div class="w-full flex justify-end">
<button class="p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors" onclick="event.stopPropagation();">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</div>
<div class="flex-1 flex flex-col items-center justify-center w-full gap-md">
<p class="font-label-md text-label-md text-secondary uppercase tracking-widest">Answer</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-center text-primary-container">
                                f'(x) = cos(x)e^x + sin(x)e^x
                            </p>
<div class="mt-lg p-md bg-surface-container-low rounded-lg w-full text-center border border-surface-variant/50">
<p class="font-body-md text-body-md text-on-surface-variant italic">Product Rule: f'g + fg'</p>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- SM-2 Rating Bar (Hidden until flipped) -->
<div class="opacity-0 pointer-events-none transition-opacity duration-300 w-full flex justify-between gap-sm pt-md pb-md" id="srs-controls">
<button class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-full btn-again active:scale-95 transition-transform shadow-sm border border-red-200">
<span class="font-label-md text-label-md font-bold mb-0.5">Again</span>
<span class="text-[10px] font-semibold opacity-80">&lt;1m</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-full btn-hard active:scale-95 transition-transform shadow-sm border border-orange-200">
<span class="font-label-md text-label-md font-bold mb-0.5">Hard</span>
<span class="text-[10px] font-semibold opacity-80">2d</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-full btn-good active:scale-95 transition-transform shadow-sm border border-green-200">
<span class="font-label-md text-label-md font-bold mb-0.5">Good</span>
<span class="text-[10px] font-semibold opacity-80">4d</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-full btn-easy active:scale-95 transition-transform shadow-sm border border-purple-200">
<span class="font-label-md text-label-md font-bold mb-0.5">Easy</span>
<span class="text-[10px] font-semibold opacity-80">7d</span>
</button>
</div>
<!-- Quick Tools -->
<div class="flex justify-center gap-lg py-sm mb-md">
<button class="flex flex-col items-center gap-xs text-secondary hover:text-primary transition-colors">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
</div>
<span class="font-label-sm text-label-sm">AI Explain</span>
</button>
<button class="flex flex-col items-center gap-xs text-secondary hover:text-primary transition-colors">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
</div>
<span class="font-label-sm text-label-sm">Hint</span>
</button>
<button class="flex flex-col items-center gap-xs text-secondary hover:text-primary transition-colors">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
</div>
<span class="font-label-sm text-label-sm">Save</span>
</button>
</div>
</main>
<!-- Suppressed Nav Shells -->
<!-- Nav excluded as this is a focused study session (Linear/Transactional task) -->
<script>
    function flipCard() {
        const cardInner = document.getElementById('card-inner');
        const srsControls = document.getElementById('srs-controls');
        
        cardInner.classList.toggle('flipped');
        
        if (cardInner.classList.contains('flipped')) {
            srsControls.classList.remove('opacity-0', 'pointer-events-none');
        } else {
            srsControls.classList.add('opacity-0', 'pointer-events-none');
        }
    }

    // Simple visual pomodoro countdown
    let timeLeft = 25 * 60; // 25 minutes in seconds
    const timerDisplay = document.getElementById('pomodoro-timer');
    
    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    }, 1000);
</script>
</body></html>
