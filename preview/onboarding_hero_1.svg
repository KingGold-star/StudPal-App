<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ambient Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#EDE9FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange Badge Gradient -->
    <linearGradient id="orangeBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5400"/>
    </linearGradient>

    <!-- Purple Badge Gradient -->
    <linearGradient id="purpleBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="badgeShadowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6B00" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7928CA" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Ambient Background Glow -->
  <circle cx="200" cy="200" r="150" fill="url(#bgGlow)"/>

  <!-- 2. Desk Ground Shadow -->
  <ellipse cx="200" cy="365" rx="130" ry="16" fill="#E8EEF5" opacity="0.8"/>

  <!-- 3. Purple Chair Back -->
  <rect x="232" y="215" width="46" height="90" rx="20" fill="#DDD6FE" opacity="0.95"/>

  <!-- 4. Student Character -->
  <!-- Torso (Blue Shirt) -->
  <path d="M152 270 C152 250, 248 250, 248 270 L252 325 L148 325 Z" fill="#1D4ED8"/>
  
  <!-- Arms (Curved around laptop) -->
  <path d="M156 268 C136 278, 136 312, 162 324" stroke="#E5A97A" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M244 268 C264 278, 264 312, 238 324" stroke="#E5A97A" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Neck -->
  <rect x="190" y="222" width="20" height="26" rx="6" fill="#D49566"/>

  <!-- Head -->
  <circle cx="200" cy="202" r="28" fill="#E5A97A"/>

  <!-- Hair (Neat bowl / fringe haircut) -->
  <path d="M174 200 C174 174, 226 174, 226 200 C226 195, 218 190, 200 190 C182 190, 174 195, 174 200 Z" fill="#1F2937"/>
  <rect x="176" y="180" width="48" height="15" rx="7" fill="#1F2937"/>

  <!-- Eyes & Smile -->
  <circle cx="192" cy="200" r="2.5" fill="#1F2937"/>
  <circle cx="208" cy="200" r="2.5" fill="#1F2937"/>
  <path d="M194 210 Q200 216 206 210" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- 5. Modern White Desk Surface -->
  <rect x="70" y="325" width="260" height="32" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#softShadow)"/>

  <!-- 6. Desk Accessories -->
  <!-- Green Potted Plant (Left) -->
  <rect x="90" y="310" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M99 310 C90 300, 88 285, 96 280 C100 288, 99 302, 99 310 Z" fill="#10B981"/>
  <path d="M99 310 C108 300, 110 285, 102 280 C98 288, 99 302, 99 310 Z" fill="#34D399"/>

  <!-- Silver Laptop (Center) -->
  <rect x="155" y="324" width="90" height="6" rx="3" fill="#94A3B8"/>
  <path d="M162 324 L167 276 L233 276 L238 324 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="171" y="280" width="58" height="40" rx="3" fill="#F0F9FF"/>
  <circle cx="200" cy="300" r="4.5" fill="#0EA5E9"/>

  <!-- Orange Notebook / Card (Right) -->
  <rect x="250" y="318" width="38" height="15" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <line x1="256" y1="325" x2="280" y2="325" stroke="#FB923C" stroke-width="2" stroke-linecap="round"/>

  <!-- 7. Floating UI Badges -->
  <!-- Top-Left: Orange Pill Badge -->
  <g filter="url(#badgeShadowOrange)">
    <rect x="62" y="24" width="84" height="36" rx="18" fill="url(#orangeBadgeGrad)"/>
    <circle cx="78" cy="42" r="3.5" fill="#FFFFFF"/>
    <rect x="87" y="38" width="42" height="3.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="78" y="47" width="51" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>

  <!-- Top-Right: Purple Rounded Card -->
  <g filter="url(#badgeShadowPurple)">
    <rect x="278" y="28" width="64" height="54" rx="18" fill="url(#purpleBadgeGrad)"/>
    <rect x="292" y="40" width="36" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="301" y="46" width="18" height="10" rx="3" fill="#F59E0B"/>
    <rect x="298" y="60" width="24" height="2.5" rx="1.25" fill="#CBD5E1"/>
  </g>

  <!-- Middle-Left: Sparkle Note Card -->
  <g filter="url(#softShadow)">
    <rect x="32" y="118" width="86" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="44" y="129" width="22" height="22" rx="6" fill="#FFF7ED"/>
    <text x="50" y="145" font-size="12" fill="#F59E0B">✨</text>
    <rect x="72" y="134" width="32" height="3.5" rx="1.75" fill="#CBD5E1"/>
    <rect x="72" y="142" width="20" height="3" rx="1.5" fill="#E2E8F0"/>
  </g>

  <!-- Middle-Right: Blue Sync Refresh Badge -->
  <g filter="url(#softShadow)">
    <rect x="318" y="132" width="46" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="332" y="146" width="18" height="18" rx="4" fill="#3B82F6"/>
    <!-- Refresh Arrows in White -->
    <path d="M338 152 A3 3 0 1 1 336 156" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M338 150 L338 153 L341 153" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Sparkle Stars -->
  <!-- Top Right Sparkle -->
  <path d="M352 86 Q352 92 357 92 Q352 92 352 98 Q352 92 347 92 Q352 92 352 86 Z" fill="#FDBA74"/>
  <!-- Top Left Sparkle -->
  <path d="M42 110 Q42 115 46 115 Q42 115 42 120 Q42 115 38 115 Q42 115 42 110 Z" fill="#FDBA74"/>
</svg>
